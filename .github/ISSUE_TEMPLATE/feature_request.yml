name: 功能建议 / Feature request
description: 分享使用场景和希望改进的体验。
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: 请先查看 README 中的 Roadmap 和已有 issue，避免重复建议。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
      description: 在什么场景下遇到了什么不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望实现的功能
      description: 描述期待的操作方式和结果，可附草图或示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与补充信息
      description: 是否尝试过其他解决办法？这项改进会帮助哪些用户？
